name: CI & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── CLI build (no GUI) for all platforms ──
  build-cli:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation deps (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/hexz.exe hexz-${{ matrix.suffix }}.exe
          else
            cp target/${{ matrix.target }}/release/hexz hexz-${{ matrix.suffix }}
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: hexz-cli-${{ matrix.suffix }}
          path: hexz-${{ matrix.suffix }}*

  # ── GUI build for all platforms ──
  build-gui:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux deps (GUI)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Build GUI
        run: cargo build --release --features gui --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/hexz.exe hexz-gui-${{ matrix.suffix }}.exe
          else
            cp target/${{ matrix.target }}/release/hexz hexz-gui-${{ matrix.suffix }}
          fi
      - name: Create macOS .app bundle
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          APP="hexz-gui-${{ matrix.suffix }}.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/${{ matrix.target }}/release/hexz "$APP/Contents/MacOS/hexz"
          cp assets/hexz.icns "$APP/Contents/Resources/hexz.icns"
          chmod +x "$APP/Contents/MacOS/hexz"
          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>  <string>hexz</string>
              <key>CFBundleName</key>        <string>hexz</string>
              <key>CFBundleIdentifier</key>  <string>com.hexz.app</string>
              <key>CFBundleIconFile</key>    <string>hexz</string>
              <key>CFBundleVersion</key>     <string>${{ github.ref_name }}</string>
              <key>CFBundleShortVersionString</key> <string>${{ github.ref_name }}</string>
              <key>LSUIElement</key>         <true/>
              <key>NSHighResolutionCapable</key> <true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          zip -r "hexz-gui-${{ matrix.suffix }}.app.zip" "$APP"
      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: hexz-gui-${{ matrix.suffix }}
          path: hexz-gui-${{ matrix.suffix }}
      - name: Upload macOS .app bundle
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v5
        with:
          name: hexz-gui-${{ matrix.suffix }}-app
          path: hexz-gui-${{ matrix.suffix }}.app.zip

  # ── GitHub Release (push to main → update latest tag) ──
  release:
    needs: [build-cli, build-gui]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: hexz-*
          path: artifacts
          merge-multiple: true
      - name: Get latest tag
        run: echo "LATEST_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
      - name: Show downloaded files
        run: ls -la artifacts/
      - name: Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LATEST_TAG }}
          name: ${{ env.LATEST_TAG }}
          body: |
            ## hexz_k ${{ env.LATEST_TAG }}

            Auto-updated on push to `main`.

            **CLI** — Command-line interface (no GUI dependencies)
            **GUI** — Graphical interface with Keka-like UI (macOS .app included)
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
