[package]
name = "hexz_k"
version = "0.2.0"
edition = "2024"
description = "hexz_k — hexz archive tool for game resource packs"
default-run = "hexz"

[[bin]]
name = "hexz"
path = "src/main.rs"

[lib]
name = "hexz_k"
path = "src/lib.rs"

[dependencies]
# Hexz ecosystem
hexz-core = "0.8"
hexz-store = "0.8"
hexz-ops = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Password input
rpassword = "7"
bincode = "1"

# GUI (optional, compile without for CLI-only)
egui = { version = "0.31", optional = true }
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.15", optional = true }
image = { version = "0.25", optional = true }

[features]
default = []
gui = ["egui", "eframe", "rfd", "image"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
strip = true
