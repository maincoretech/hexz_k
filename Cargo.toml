[package]
name = "hexz_k"
version = "0.2.0"
edition = "2024"
description = "hexz_k — hexz archive tool for game resource packs"
default-run = "hexz"

[[bin]]
name = "hexz"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "hexz_k"
path = "src/lib.rs"

[dependencies]
# Hexz ecosystem
hexz-core = { version = "0.8", default-features = false, features = ["compression-zstd", "encryption"] }
hexz-store = { version = "0.8", default-features = false }
hexz-ops = { version = "0.8", default-features = false, features = ["compression-zstd", "encryption"], optional = true }

# CLI
clap = { version = "4", features = ["derive"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Password input
rpassword = { version = "7", optional = true }
bincode = "1"

# GUI (optional, compile without for CLI-only)
egui = { version = "0.31", optional = true }
eframe = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:hexz-ops", "dep:rpassword"]
pack = ["dep:hexz-ops"]
gui = ["cli", "egui", "eframe", "rfd", "image"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
strip = true
